name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Windows PowerShell 5.1 -- the compatibility floor this tooling targets
  # (see CONTRIBUTING.md, "PowerShell compatibility"). tests/run-tests.ps1
  # itself covers: PowerShell syntax for every script/module, JSON parsing
  # (profile + every synthetic fixture), JSON Schema validation against
  # schemas/*.json, the read-only/mutation structural boundary check, and
  # every unit/regression assertion for both lifecycle paths.
  validate-powershell51:
    name: Validate (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run test suite (powershell.exe / Windows PowerShell 5.1)
        # `shell: powershell` wraps this run: block in a temp .ps1 file
        # invoked via `powershell -Command ". 'temp.ps1'"` -- DOT-SOURCED
        # into the runner's own scope, not a fresh process. This suite's
        # nested-module import order (documented at length in its own
        # header and in CONTRIBUTING.md) depends on module-scope
        # boundaries that behave differently under a dot-sourced caller
        # than under a normal script invocation -- confirmed empirically
        # (this exact test suite passed 487/487 locally via a normal
        # `powershell.exe -File` invocation, then failed a cluster of
        # mocked-API tests here). Spawning tests/run-tests.ps1 as its own
        # genuinely separate process (-File, not dot-sourced, not `.\`)
        # sidesteps the difference entirely.
        shell: cmd
        run: powershell.exe -NoProfile -File tests\run-tests.ps1

  # Modern PowerShell (pwsh, PowerShell 7+), same Windows runner -- this
  # tooling's path handling ('lib\Sub.psm1'-style literal backslash
  # segments, matching every script's own established convention) is not
  # yet slash-agnostic, so "modern PowerShell" is validated on the same
  # OS rather than claiming Linux/macOS support this repository hasn't
  # built or tested -- see docs/architecture.md and CONTRIBUTING.md.
  validate-pwsh:
    name: Validate (modern PowerShell / pwsh)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run test suite (pwsh)
        # Same reasoning as the Windows PowerShell 5.1 job above: spawn a
        # genuinely fresh pwsh process (-File) rather than relying on
        # `shell: pwsh`'s own dot-sourced temp-file wrapper.
        shell: cmd
        run: pwsh -NoProfile -File tests\run-tests.ps1

  # Stable, matrix-independent summary job -- the ONE job name any future
  # branch-protection ruleset for this repository should require, per
  # this tooling's own CDA repository baseline practice (see
  # COMPLIANCE.md and docs/safety-model.md).
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    needs: [validate-powershell51, validate-pwsh]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          for result in "${{ needs.validate-powershell51.result }}" "${{ needs.validate-pwsh.result }}"; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done
          echo "All required jobs succeeded."
